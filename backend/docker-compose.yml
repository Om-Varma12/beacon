services:
  api: 
    image: omvarma12/beacon-backend:v1
    container_name: beacon-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 -- port 8000 --workers 4

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - redis

    networks:
      - beacon-network


  worker:
    image: omvarma12/beacon-backend:v1
    container_name: beacon-worker
    restart: unless-stopped

    command: python worker.py

    env_file:
      - .env

    enviroment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - redis

    networks:
      - beacon_network


  redis:
    image: redis:7-alpine
    container_name: beacon-redis
    restart: unless-stopped

    network:
      - beacon-network


networks:
  beacon-network:
    driver: bridge