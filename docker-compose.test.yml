services:
  backend:
    build:
      context: ./backend

    container_name: beacon-backend

    working_dir: /app

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    environment:
      REDIS_URL: redis://host.docker.internal:6379/0

    command: python uvicorn main:app --reload


  job-worker:
    build:
      context: ./backend

    working_dir: /app

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    environment:
      REDIS_URL: redis://host.docker.internal:6379/0

    command: python -m worker.job_worker


  action-aggregator:
    build:
      context: ./backend

    working_dir: /app

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    environment:
      REDIS_URL: redis://host.docker.internal:6379/0

    command: python -m worker.action_aggregator


  reaction-worker:
    build:
      context: ./backend

    working_dir: /app

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    environment:
      REDIS_URL: redis://host.docker.internal:6379/0

    command: python -m worker.reaction_worker


