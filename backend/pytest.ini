[pytest]
markers =
    unit: fast, no external deps
    api: hits FastAPI via TestClient
    migration: tests raw SQL migrations and schema integrity against a real DB
    repos: tests repository layer against a real DB with automatic rollback
    e2e: slow, real external services (Cognito, Groq, etc.)
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
# Migration tests DROP SCHEMA CASCADE which conflicts with session-scoped fixtures
# used by api/repo/unit tests. Run them separately: uv run pytest tests/migrations/
addopts = --ignore=tests/migrations